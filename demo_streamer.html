<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>PNGTuber Configurator</title>
  <style>
    body {
      margin: 0; padding: 0;
      background: #222; color: #eee; font-family: sans-serif;
      display: flex; height: 100vh;
    }

    /* 左側：プレビューエリア (グリーンバック想定) */
    .preview-area {
      flex: 1;
      background: #00b140; /* クロマキーグリーン */
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      position: relative;
    }
    .preview-label {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px;
    }
    iframe { width: 400px; height: 400px; border: 2px dashed rgba(255,255,255,0.3); }

    /* 右側：コントロールパネル */
    .control-panel {
      width: 300px; background: #333; padding: 20px;
      box-shadow: -2px 0 10px rgba(0,0,0,0.3);
      overflow-y: auto;
    }
    h2 { border-bottom: 1px solid #555; padding-bottom: 10px; margin-top: 0;}
    
    .control-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #aaa; }
    input[type="range"] { width: 100%; }
    .val-disp { float: right; color: #fff; font-weight: bold; }

    button {
      width: 100%; padding: 10px; background: #4A90E2; color: white;
      border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
      margin-bottom: 10px;
    }
    button:hover { background: #357ABD; }
    button.active { background: #E74C3C; animation: pulse 1s infinite; }
    
    @keyframes pulse { 0%{opacity:1;} 50%{opacity:0.7;} 100%{opacity:1;} }

    .meter { width: 100%; height: 10px; background: #444; border-radius: 5px; overflow: hidden; margin-top: 5px; }
    .meter-fill { height: 100%; width: 0%; background: #27AE60; transition: width 0.1s; }
  </style>
</head>
<body>

  <!-- プレビュー -->
  <div class="preview-area">
    <div class="preview-label">PREVIEW (GB)</div>
    <iframe id="tuber" src="essential-pngtuber.html"></iframe>
  </div>

  <!-- 設定パネル -->
  <div class="control-panel">
    <h2>設定パネル</h2>

    <div class="control-group">
      <button id="micBtn" onclick="toggleMic()">🎤 マイク入力開始</button>
      <label>入力レベル</label>
      <div class="meter"><div id="volMeter" class="meter-fill"></div></div>
    </div>

    <div class="control-group">
      <label>口パク感度 (Threshold) <span id="disp-thresh" class="val-disp">0.02</span></label>
      <input type="range" min="0.00" max="0.2" step="0.001" value="0.02" oninput="updateConfig('threshold', this.value, 'disp-thresh')">
    </div>

    <div class="control-group">
      <label>揺れの強さ (Bound Strength) <span id="disp-bound" class="val-disp">8</span></label>
      <input type="range" min="0" max="50" step="1" value="8" oninput="updateConfig('boundStrength', this.value, 'disp-bound')">
    </div>

    <div class="control-group">
      <label>揺れの速さ (Bound Speed) <span id="disp-speed" class="val-disp">0.8</span></label>
      <input type="range" min="0.1" max="5.0" step="0.1" value="0.8" oninput="updateConfig('boundSpeed', this.value, 'disp-speed')">
    </div>
    
    <div class="control-group">
      <label>瞬き間隔 (秒) <span id="disp-blink" class="val-disp">4.0</span></label>
      <input type="range" min="0.5" max="10.0" step="0.5" value="4.0" oninput="updateConfig('blinkInterval', this.value, 'disp-blink')">
    </div>

    <div style="margin-top:30px; padding-top:20px; border-top:1px solid #555;">
      <small style="color:#888;">
        ※ この設定値はプレビュー用です。本番コードには `setConfig({...})` の値をコピーして使ってください。
      </small>
    </div>
  </div>

<script>
  const iframe = document.getElementById('tuber');
  let pngtuber = null;
  let isMicOn = false;

  iframe.onload = function() {
    pngtuber = iframe.contentWindow.pngtuber;
    
    // 初期画像セット
    const path = 'img/';
    pngtuber.setImages({
      closedOpen: path + 'miku_normal.png',
      openOpen:   path + 'miku_talk.png',
      closedClosed: path + 'miku_blink.png',
      openClosed:   path + 'miku_talk_blink.png'
    });

    // 音量メーターの更新ループ
    setInterval(() => {
      if(pngtuber) {
        const state = pngtuber.getState();
        const volPercent = Math.min(state.volume * 500, 100); // 適当に正規化
        document.getElementById('volMeter').style.width = volPercent + '%';
      }
    }, 50);
  };

  function toggleMic() {
    if (!pngtuber) return;
    const btn = document.getElementById('micBtn');
    
    if (!isMicOn) {
      pngtuber.startMicrophone();
      btn.innerText = "⏹ マイク停止";
      btn.classList.add('active');
      isMicOn = true;
    } else {
      pngtuber.stopMicrophone();
      btn.innerText = "🎤 マイク入力開始";
      btn.classList.remove('active');
      isMicOn = false;
    }
  }

  function updateConfig(key, value, displayId) {
    if (!pngtuber) return;
    
    // 数値変換
    const numVal = parseFloat(value);
    
    // 表示更新
    document.getElementById(displayId).innerText = numVal;
    
    // 設定反映
    const config = {};
    config[key] = numVal;
    pngtuber.setConfig(config);
  }
</script>
</body>
</html>
