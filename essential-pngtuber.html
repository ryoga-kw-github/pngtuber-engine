<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Essential PNGTuber</title>
  <style>
    body {
      overflow: hidden !important;
      margin: 0;
      padding: 0;
      background: transparent;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #pngtuber-container { 
      position: relative; 
      width: 100%; 
      height: 100%; 
      margin: 0; 
      background: transparent;
    }
    #pngtuber-sprite { 
      position: absolute; 
      left: 0; 
      top: 0; 
      width: 100%; 
      height: 100%;
      object-fit: contain;
      object-position: center;
      transition: transform 0.05s ease-out;
      will-change: transform;
    }
  </style>
</head>
<body>

<div id="pngtuber-container">
  <img id="pngtuber-sprite" src="" alt="PNGTuber">
</div>

<script>
/**
 * Essential PNGTuber v3.2 (Readable + Dynamic Motion)
 * 外部から制御可能なPNGTuberエンジン
 * JSON設定読み込み対応 + 発話時モーション変化
 */

class EssentialPNGTuber {
  constructor(containerId = 'pngtuber-container') {
    // DOM要素の取得
    this.container = document.getElementById(containerId);
    this.sprite = document.getElementById('pngtuber-sprite');
    
    // 設定オブジェクト（デフォルト値）
    this.config = {
      // 画像パス設定
      images: {
        closedOpen: '',     // 口閉じ・目開き (待機)
        openOpen: '',       // 口開き・目開き (発話)
        closedClosed: '',   // 口閉じ・目閉じ (瞬き)
        openClosed: ''      // 口開き・目閉じ (発話瞬き)
      },
      
      // アニメーション設定
      threshold: 0.02,        // 口パク感度
      blinkInterval: 4.0,     // まばたき間隔（秒）
      blinkChance: 0.3,       // まばたき確率
      boundStrength: 8,       // 揺れの強度
      boundSpeed: 0.8,        // 揺れ速さ
      
      // 表示設定
      width: 100,
      height: 100,
      backgroundColor: 'transparent',
      fit: 'contain',         // 画像のフィットモード
      
      // 高度な設定
      smoothing: 0.4,         // 音声解析の平滑化 (0.0〜1.0)
      
      // イベントフック
      onSpeakStart: null,
      onSpeakEnd: null
    };
    
    // 内部状態の管理
    this.state = {
      speaking: false,
      blinking: false,
      lastVolume: 0,
      blinkTimeout: 0,
      blinkTimer: 0,
      startTime: Date.now()
    };
    
    // 音声処理用オブジェクト
    this.audio = {
      context: null,
      analyser: null,
      sourceNode: null,
      dataArray: null,
      stream: null
    };
    
    this.animationId = null;
    this.isInitialized = false;
    
    // 外部音声制御用
    this.externalAudioSource = null;
    
    // URLパラメータの解析準備
    this.queryParams = new URLSearchParams(window.location.search);
  }
  
  /**
   * 初期化処理
   */
  async init() {
    try {
      if (this.queryParams.has('config')) {
        const configUrl = this.queryParams.get('config');
        await this.loadConfigFromJsonUrl(configUrl);
      }

      this.loadConfigFromQuery();
      this.applyStyles();
      this.preloadImages();
      this.updateSprite();
      this.startAnimation();
      
      this.isInitialized = true;
      console.log('Essential PNGTuber initialized');
      
    } catch (error) {
      console.error('PNGTuber initialization failed:', error);
    }
  }

  /**
   * JSONファイルから設定を読み込んで適用する
   */
  async loadConfigFromJsonUrl(url) {
    try {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Config load failed: ${response.status} ${response.statusText}`);
      }
      const json = await response.json();

      if (json.images) {
        Object.assign(this.config.images, json.images);
      }
      
      const { images, ...otherConfig } = json;
      Object.assign(this.config, otherConfig);

    } catch (e) {
      console.warn('Failed to load config JSON:', e);
    }
  }

  /**
   * URLクエリパラメータから設定を読み込む
   */
  loadConfigFromQuery() {
    const params = this.queryParams;
    const imageKeys = ['closedOpen', 'openOpen', 'closedClosed', 'openClosed'];
    imageKeys.forEach(key => {
      if (params.has(key)) {
        this.config.images[key] = params.get(key);
      }
    });

    if (params.has('fit')) this.config.fit = params.get('fit');
    if (params.has('threshold')) this.config.threshold = parseFloat(params.get('threshold'));
    if (params.has('boundStrength')) this.config.boundStrength = parseFloat(params.get('boundStrength'));
    if (params.has('boundSpeed')) this.config.boundSpeed = parseFloat(params.get('boundSpeed'));
  }

  /**
   * 現在の設定値をDOM要素のスタイルに反映させる
   */
  applyStyles() {
    this.container.style.width = this.config.width + '%';
    this.container.style.height = this.config.height + '%';
    this.container.style.background = this.config.backgroundColor;
    this.sprite.style.objectFit = this.config.fit;
    
    if (this.config.smoothing !== undefined && this.audio.analyser) {
      this.audio.analyser.smoothingTimeConstant = this.config.smoothing;
    }
  }

  /**
   * 画像のプリロード
   */
  preloadImages() {
    Object.values(this.config.images).forEach(src => {
      if (src) {
        const img = new Image();
        img.src = src;
      }
    });
  }
  
  /**
   * 画像パスを設定する（外部呼び出し用）
   * この機能は、setConfig に統合されていますが、互換性維持のために残しています。新規開発においては setConfig を推奨します。
   */
  setImages(images) {
    Object.assign(this.config.images, images);
    this.preloadImages();
    this.updateSprite();
  }
  
  /**
   * 設定を更新する（外部呼び出し用）
   * この機能は、各種パラメータと、画像設定を一括で更新できます。旧setImagesの機能を包括しており、新規開発においてはこちらを推奨します。
   */
  setConfig(newConfig) {
    Object.assign(this.config, newConfig);
    
    if (newConfig.images) {
      Object.assign(this.config.images, newConfig.images);
      this.preloadImages();
      this.updateSprite();
    }

    this.applyStyles();
  }
  
  /**
   * マイク入力を開始する
   */
  async startMicrophone() {
    try {
      this.stopExternalAudio();
      
      if (!this.audio.context || this.audio.context.state === 'closed') {
        this.audio.context = new (window.AudioContext || window.webkitAudioContext)();
      }
      
      if (this.audio.context.state === 'suspended') {
        await this.audio.context.resume();
      }
      
      this.audio.stream = await navigator.mediaDevices.getUserMedia({ 
        audio: { 
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        } 
      });
      
      this.audio.sourceNode = this.audio.context.createMediaStreamSource(this.audio.stream);
      this.audio.analyser = this.audio.context.createAnalyser();
      this.audio.analyser.fftSize = 512;
      this.audio.analyser.smoothingTimeConstant = this.config.smoothing;
      this.audio.dataArray = new Uint8Array(this.audio.analyser.frequencyBinCount);
      this.audio.sourceNode.connect(this.audio.analyser);
      
      console.log('Microphone started');
      
    } catch (error) {
      console.error('Microphone error:', error);
    }
  }
  
  /**
   * 外部音声バッファを再生する
   */
  async playAudioFile(audioBuffer, loop = true, muted = false) {
    try {
      this.stopMicrophone();
      this.stopExternalAudio();
      
      if (!this.audio.context || this.audio.context.state === 'closed') {
        this.audio.context = new (window.AudioContext || window.webkitAudioContext)();
      }
      
      if (this.audio.context.state === 'suspended') {
        await this.audio.context.resume();
      }
      
      this.externalAudioSource = this.audio.context.createBufferSource();
      this.externalAudioSource.buffer = audioBuffer;
      this.externalAudioSource.loop = loop;
      
      this.audio.analyser = this.audio.context.createAnalyser();
      this.audio.analyser.fftSize = 512;
      this.audio.analyser.smoothingTimeConstant = this.config.smoothing;
      this.audio.dataArray = new Uint8Array(this.audio.analyser.frequencyBinCount);
      this.externalAudioSource.connect(this.audio.analyser);
      
      if (!muted) {
        this.audio.analyser.connect(this.audio.context.destination);
      }
      
      this.externalAudioSource.start();
      console.log(`External audio started ${muted ? '(muted)' : ''}`);
    } catch (error) {
      console.error('External audio error:', error);
    }
  }
  
  /**
   * ファイルオブジェクトから音声を読み込んで再生
   */
  async loadAndPlayAudio(file, loop = true) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          if (!this.audio.context) {
            this.audio.context = new (window.AudioContext || window.webkitAudioContext)();
          }
          const audioBuffer = await this.audio.context.decodeAudioData(e.target.result);
          await this.playAudioFile(audioBuffer, loop);
          resolve();
        } catch (error) { reject(error); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    });
  }
  
  /**
   * URLから音声を読み込んで再生
   */
  async loadAndPlayAudioFromUrl(url, loop = false, muted = false) {
    try {
      const response = await fetch(url);
      const arrayBuffer = await response.arrayBuffer();
      if (!this.audio.context) {
        this.audio.context = new (window.AudioContext || window.webkitAudioContext)();
      }
      const audioBuffer = await this.audio.context.decodeAudioData(arrayBuffer);
      await this.playAudioFile(audioBuffer, loop, muted);
    } catch (error) { console.error('Audio URL load error:', error); }
  }
  
  stopMicrophone() {
    if (this.audio.stream) {
      this.audio.stream.getTracks().forEach(track => track.stop());
      this.audio.stream = null;
    }
  }
  
  stopExternalAudio() {
    if (this.externalAudioSource) {
      this.externalAudioSource.stop();
      this.externalAudioSource = null;
    }
  }
  
  setSpeaking(speaking) { this.state.speaking = speaking; this.updateSprite(); }
  setBlink(blinking) { this.state.blinking = blinking; this.updateSprite(); }
  
  updateSprite() {
    let imagePath = null;
    const imgSet = this.config.images;
    if (this.state.blinking) {
      imagePath = this.state.speaking ? imgSet.openClosed : imgSet.closedClosed;
    } else {
      imagePath = this.state.speaking ? imgSet.openOpen : imgSet.closedOpen;
    }
    if (imagePath && this.sprite.src !== imagePath && this.sprite.src !== window.location.href + imagePath) {
      this.sprite.src = imagePath;
    }
  }
  
  /**
   * アニメーションループ（メイン処理）
   */
  animate() {
    const now = Date.now();
    const elapsed = (now - this.state.startTime) / 1000;

    // ▼▼▼▼ ここから変更：発話時に動きを激しくする ▼▼▼▼
    let currentStrength = this.config.boundStrength;
    let currentSpeed = this.config.boundSpeed;

    if (this.state.speaking) {
      currentStrength *= 1.5; // 揺れ幅 1.5倍
      currentSpeed *= 2.0;    // 速さ 2倍
    }

    // 揺れ（バウンド）アニメーション
    const y = currentStrength * Math.sin(elapsed * currentSpeed * 2);
    const scale = 1 + 0.02 * Math.sin(elapsed * currentSpeed);
    this.sprite.style.transform = `translateY(${y}px) scale(${scale})`;
    // ▲▲▲▲ ここまで変更 ▲▲▲▲
    
    // 音声解析と口パク判定
    if (this.audio.analyser && this.audio.dataArray) {
      this.audio.analyser.getByteFrequencyData(this.audio.dataArray);
      
      let sum = 0;
      for (let i = 0; i < Math.min(64, this.audio.dataArray.length); i++) {
        sum += this.audio.dataArray[i] * this.audio.dataArray[i];
      }
      
      const rms = Math.sqrt(sum / Math.min(64, this.audio.dataArray.length)) / 255.0;
      this.state.lastVolume = rms;
      
      const isSpeakingNow = rms > this.config.threshold;
      
      if (isSpeakingNow !== this.state.speaking) {
        this.state.speaking = isSpeakingNow;
        
        if (isSpeakingNow) {
          if (typeof this.config.onSpeakStart === 'function') this.config.onSpeakStart();
        } else {
          if (typeof this.config.onSpeakEnd === 'function') this.config.onSpeakEnd();
        }
      }
    }
    
    // まばたき処理
    if (!this.state.blinkTimeout || now > this.state.blinkTimeout) {
      if (Math.random() < this.config.blinkChance) {
        this.state.blinking = true;
        this.state.blinkTimer = now + 150;
      }
      this.state.blinkTimeout = now + (this.config.blinkInterval * 1000);
    }
    
    if (this.state.blinking && now > this.state.blinkTimer) {
      this.state.blinking = false;
    }
    
    this.updateSprite();
    this.animationId = requestAnimationFrame(() => this.animate());
  }
  
  startAnimation() { if (this.animationId) cancelAnimationFrame(this.animationId); this.animate(); }
  stopAnimation() { if (this.animationId) cancelAnimationFrame(this.animationId); this.animationId = null; }
  getState() { return { speaking: this.state.speaking, blinking: this.state.blinking, volume: this.state.lastVolume }; }
  destroy() {
    this.stopAnimation(); this.stopMicrophone(); this.stopExternalAudio();
    if (this.audio.context && this.audio.context.state !== 'closed') {
      this.audio.context.close();
    }
  }
}

const pngtuber = new EssentialPNGTuber();
window.addEventListener('load', () => { pngtuber.init(); });
window.addEventListener('beforeunload', () => { pngtuber.destroy(); });
window.EssentialPNGTuber = EssentialPNGTuber;
window.pngtuber = pngtuber;

</script>

</body>
</html>
